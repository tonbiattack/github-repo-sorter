<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Repo Sorter settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__head">
        <h1 data-i18n="optionsHeading">GitHub Repo Sorter</h1>
        <p class="lead" data-i18n="optionsLead">
          Sort the repository list on a GitHub profile page by recent activity.
        </p>
      </header>

      <section class="card">
        <h2 data-i18n="tokenHeading">Access token (optional)</h2>
        <p class="hint" data-i18n="tokenHint">
          Add a token to include your private repositories.
        </p>

        <p id="status" class="status" role="status" aria-live="polite">Checking…</p>

        <form id="token-form" class="form">
          <label class="field">
            <span class="field__label" data-i18n="tokenLabel">Read-only access token</span>
            <input
              id="token"
              class="input"
              type="password"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="tokenPlaceholder"
              placeholder="github_pat_… or ghp_…"
            />
          </label>

          <label class="check">
            <input id="persist" type="checkbox" />
            <span data-i18n="persistLabel">
              Keep the token after a browser restart
            </span>
          </label>
          <p class="warn" id="persist-warning" hidden data-i18n="persistWarning">
            The token will be left on this device's disk in plain text.
          </p>

          <div class="actions">
            <button id="save" class="button button--primary" type="submit" data-i18n="buttonSave">
              Save and verify
            </button>
            <button id="clear" class="button" type="button" data-i18n="buttonClearToken">
              Remove token
            </button>
            <button id="clear-cache" class="button button--subtle" type="button" data-i18n="buttonClearCache">
              Clear cache
            </button>
          </div>
        </form>

        <ul class="notes">
          <li data-i18n="tokenSectionNote1"></li>
          <li data-i18n="tokenSectionNote2"></li>
          <li data-i18n="tokenSectionNote3"></li>
          <li data-i18n="tokenSectionNote4"></li>
        </ul>
      </section>

      <section class="card">
        <h2 data-i18n="usageHeading">How to use</h2>
        <ol class="notes">
          <li data-i18n="usageStep1"></li>
          <li data-i18n="usageStep2"></li>
          <li data-i18n="usageStep3"></li>
          <li data-i18n="usageStep4"></li>
        </ol>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
